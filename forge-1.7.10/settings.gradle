pluginManagement {
    repositories {
        maven {
            name = 'GTNH Maven'
            url = 'https://nexus.gtnewhorizons.com/repository/public/'
            mavenContent {
                includeGroup 'com.gtnewhorizons'
                includeGroupByRegex 'com\\.gtnewhorizons\\..+'
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'azlink-forge-1.7.10'

// The same included build is reused by the modern root, so IDEA imports its sources only once.
includeBuild('../common') { name = 'azlink-common' }
