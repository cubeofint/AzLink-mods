pluginManagement {
    repositories {
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'azlink'

def modules = [
        'common',
        'forge',
        'neoforge',
]

modules.each {
    include ":azlink-${it}"
    project(":azlink-${it}").projectDir = file(it)
}

// Forge 1.7.10 uses RetroFuturaGradle in an isolated included build (avoids FG6 clash).
includeBuild('forge-1.7.10')
